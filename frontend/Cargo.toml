[package]
name = "frontend"
version = "0.1.0"
edition = "2024"

[dependencies]
leptos = { version = "*", features = ["csr"] }
leptos_router = "*"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-net = "0.6"
web-sys = { version = "0.3", features = ["console", "Window", "Navigator", "Clipboard"]}
wasm-bindgen = "0.2"
js-sys = "0.3"
shared = { path = "../shared" }
futures-util = "0.3"
futures-channel = "0.3"